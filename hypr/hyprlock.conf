# Hyprlock theme matching the Ghostty/Waybar navy and neon-cyan palette.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # Render the wallpaper itself, rather than a screenshot of open windows.
    # wallpaper-picker keeps this path synchronized when the wallpaper changes.
    path = /home/rbdd/Pictures/wallpaper/wallpapers/wallhaven-2e2xyx.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.78
    vibrancy = 0.15
}

# Current time
label {
    monitor =
    text = $TIME
    font_size = 82
    font_family = $font
    color = rgb(cdd6f4)
    position = 0, 130
    halign = center
    valign = center
}

# Date and user name
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgb(75f1fa)
    position = 0, 58
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = rgb(6c7086)
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 3
    inner_color = rgba(11, 18, 32, 0.88)
    outer_color = rgb(75f1fa)
    check_color = rgb(42ff9f)
    fail_color = rgb(f38ba8)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 18
    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    capslock_color = rgb(f9e2af)
    dots_spacing = 0.28
    position = 0, -15
    halign = center
    valign = center
}

# Keyboard-controlled power actions. Tab cycles the grey icons and
# Shift+Enter activates the selected action (normal Enter still unlocks).
label {
    monitor =
    text = cmd[update:0:1] /home/rbdd/.local/bin/hyprlock-power-action render
    font_size = 32
    font_family = $font
    color = rgb(6c7086)
    position = 0, -220
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = TAB: select   SHIFT+ENTER: execute
    font_size = 13
    font_family = $font
    color = rgb(6c7086)
    position = 0, -270
    halign = center
    valign = center
    zindex = 1
}
