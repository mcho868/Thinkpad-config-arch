# Blue-light filter profiles for the local NZ time zone.
# Lower temperature means a warmer, less blue display.

max-gamma = 120

# Daytime: no colour filter.
profile {
    time = 07:00
    identity = true
}

# Evening: mild warmth for general use.
profile {
    time = 20:30
    temperature = 4500
    gamma = 1.0
}

# Late night: warmer and slightly dimmer.
profile {
    time = 23:00
    temperature = 3800
    gamma = 0.9
}
