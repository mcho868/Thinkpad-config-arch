# Hypridle configuration for the ThinkPad laptop.
# Lock after inactivity, then suspend.  Do not force DPMS off while hyprlock
# owns the lock; output removal during a lock can crash hyprlock.

general {
    # Avoid starting a second lock screen if one is already running.
    lock_cmd = /home/rbdd/.local/bin/hyprlock-power-action lock

    # Always lock before suspend (including lid/power-management suspend).
    before_sleep_cmd = loginctl lock-session

    # Wake the displays after resume without requiring an extra key press.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock the session after 10 minutes of inactivity.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Suspend after 30 minutes of inactivity.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
