# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------

# Ctrl+Space is primary; the traditional Ctrl+b remains available.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix


# ---------------------------------------------------------------------------
# Core behavior
# ---------------------------------------------------------------------------

set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g default-shell "/usr/bin/zsh"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ",xterm-256color:RGB"
set -g set-clipboard on
set -g automatic-rename off
set -g mouse on
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# ---------------------------------------------------------------------------
# Windows and panes
# ---------------------------------------------------------------------------

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g pane-border-status top
set -g pane-border-lines double
set -g pane-border-format " #[fg=#75f1fa]#{pane_index} #[fg=#6c7086]#{pane_current_command} "
set -g pane-border-style "fg=#164e73"
set -g pane-active-border-style "fg=#1793d1"


# ---------------------------------------------------------------------------
# Copy mode (vi)
# ---------------------------------------------------------------------------

setw -g mode-keys vi

# Ghostty supports tmux's OSC52 clipboard integration, so no macOS pbcopy or
# external wl-copy dependency is needed.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down


# ---------------------------------------------------------------------------
# Yazi
# ---------------------------------------------------------------------------

if-shell -b "command -v yazi >/dev/null 2>&1" \
  "bind Tab split-window -h -l 50% -c '#{pane_current_path}' yazi" \
  "bind Tab display-message 'Yazi is not installed (yay -S yazi)'"


# ---------------------------------------------------------------------------
# Arch-neon theme — matches Ghostty's #0b1220 navy palette
# ---------------------------------------------------------------------------

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#0b1220,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 180

# Small Arch logo and session name.
set -g status-left "#[fg=#1793d1,bold] 󰣇  #[fg=#75f1fa]#S #[fg=#164e73]│ "

# Window tabs.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086,bg=#0b1220] #I:#W "
setw -g window-status-current-format "#[fg=#0b1220,bg=#42ff9f,bold] #I:#W #[fg=#42ff9f,bg=#0b1220]"
setw -g window-status-activity-style "fg=#f9e2af,bold"

# Current path, optional Git branch, dotted neon divider, and time.
set -g status-right \
"#[fg=#75f1fa]  #{=35:#{b:pane_current_path}} \
#[fg=#42ff9f]#(cd '#{pane_current_path}' 2>/dev/null && git symbolic-ref --short HEAD 2>/dev/null | sed 's/^/ /') \
#[fg=#164e73]· · · \
#[fg=#42ff9f,bold]%H:%M "

set -g message-style "bg=#164e73,fg=#f4f8ff,bold"
set -g mode-style "bg=#1793d1,fg=#0b1220,bold"
set -g clock-mode-colour "#42ff9f"


# ---------------------------------------------------------------------------
# Session persistence plugins (optional)
# ---------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# Reload with Prefix+r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# TPM is loaded only when installed, keeping a fresh tmux startup error-free.
if-shell -b "[ -x ~/.tmux/plugins/tpm/tpm ]" \
  "run-shell '~/.tmux/plugins/tpm/tpm'"
