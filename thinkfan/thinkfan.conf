# ThinkFan configuration for ThinkPad X13 Gen 5.
#
# Use stable hwmon names rather than hwmonN numbers.  The package and
# ThinkPad CPU sensors are both monitored; simple levels use the hottest one.

sensors:
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1]       # Package id 0
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1]       # ThinkPad CPU sensor

fans:
  - tpacpi: /proc/acpi/ibm/fan

# Hysteresis is provided by overlapping lower/upper limits.  Level 7 is the
# highest firmware-regulated speed; avoid disengaged/full-speed because it
# runs the fan unregulated and increases wear.
levels:
  - ["level auto", 0, 60]
  - ["level 2", 55, 72]
  - ["level 4", 68, 80]
  - ["level 7", 76, 255]
